<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Validação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
    <form>


         
        <input type="text" id="nome" placeholder="Nome">
        <p id="errorName"></p>

        <input type="email" id="email" placeholder="Email">
        <p id="errorEmail"></p>

        <input type="password" id="senha" placeholder="Senha">
        <p id="errorSenha"></p>

        <button id="botao" >Enviar</button>

    </form>

    <script>
        const nome = getelementById("nome");
        const email = getelementById("email");
        const senha = getelementById("senha");
        const botao = getelementById("botao");

        //Expressões regulares para email e senha
        const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const regexSenha = /^(?=.*[a-zA-Z])(?=.*[\w_]).{8,}$/;

        // Função para validar formulário
        function validar(){

            let valido = true;

            // Validação campo nome
            if(nome.value == ""){
                errorNme.innerText= "Nome Obrigatório";
                valido = false;
            }
            else{
                errorName.innerText = "";
            }

            //Validação do campo email
            if(!regexEmail.test(email.value)){
                errorEmail.innerText = "Email Inválido";
                valido = false;
            }
            else{
                errorEmail.innerText = "";
            }

            //Desafio: Criar validação do campo senha
            if(!regexEmail.test(senha.value)){
                errorSenha.innerText = "Senha Inválida";
                valido = false;
            }
            else{
                errorSenha.innerText = "";
            }


            botao.disabled = !valido;
        }

        nome.addEventlistener("input", validar);
        email.addEventlistener("input", validar);
        senha.addEventlistener("input", validar);

    </script>
</div>
</body>
</html>
